name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test Go packages with race detector
        if: runner.os != 'Windows'
        run: go test ./... -race -count=1
      - name: Test Go packages on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lines = & go test ./... -count=1 2>&1
          $exitCode = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            "## Windows Go test failure" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``````text" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $lines | Select-Object -Last 120 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $diagnostics = $lines |
              ForEach-Object { $_.ToString() } |
              Where-Object { $_ -match 'FAIL|panic|\.go:[0-9]+|Error:' } |
              Select-Object -Last 40
            if (-not $diagnostics) {
              $diagnostics = $lines | ForEach-Object { $_.ToString() } | Select-Object -Last 20
            }
            $summary = $diagnostics -join " | "
            if ($summary.Length -gt 3500) {
              $summary = $summary.Substring($summary.Length - 3500)
            }
            $summary = $summary -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Host "::error title=Windows Go tests failed::$summary"
            exit $exitCode
          }
      - run: pnpm --dir dashboard test -- --run
      - run: ./scripts/embed-dashboard.sh
        shell: bash
      - run: go build ./cmd/agent-doctor
      - run: ./scripts/check-secrets.sh
        shell: bash
      - run: ./scripts/check-docs.sh
        shell: bash
      - run: git diff --check

  release-snapshot:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean
      - run: node scripts/generate-release-manifest.mjs dist "$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("dist/metadata.json", "utf8")).version)')"
        shell: bash
      - run: ./scripts/verify-release.sh dist
